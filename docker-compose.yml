version: "3.8"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/models_db.sql:/docker-entrypoint-initdb.d/models_db.sql:ro
    networks:
      - appnet

  redis:
    image: redis:7
    restart: always
    networks:
      - appnet

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - db
      - redis
    env_file:
      - config/.env
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./config:/app/config
    networks:
      - appnet
    restart: always

  watcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.watcher
    depends_on:
      - db
      - api
    env_file:
      - config/.env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - appnet
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on:
      - redis
      - db
    env_file:
      - config/.env
    volumes:
      - ./model:/app/model
      - ./config:/app/config
    networks:
      - appnet
    restart: unless-stopped

volumes:
  pgdata:

networks:
  appnet:
